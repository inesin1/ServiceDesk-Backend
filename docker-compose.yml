services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_desk"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      CORS_ALLOWED_HOSTS: ${CORS_ALLOWED_HOSTS:-http://localhost:10011}
      TGBOT_TOKEN: ${TGBOT_TOKEN:-}
    ports:
      - "1002:1002"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
